[project]
name = "secure-design-patterns"
version = "1.0.0"
description = "Specification-grounded, machine-validated Secure Design Patterns Library with runnable reference implementations (starting with mcp-serve for MCP 2026-07-28)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bill Sommers" }]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["patterns.mcp_serve_ref", "scripts"]
